      function validemail(email) {
  // Check if the email ends with '@nandhaengg.org'
  const domain = "@nandhaengg.org";
  if (!email.endsWith(domain)) {
    return false;
  }

  // Extract the part before the domain
  const localPart = email.slice(0, -domain.length);

  // Check if the local part matches the pattern
  // 2 digits, 'cs', 3 digits
  const digits1 = localPart.slice(0, 2);
  const cs = localPart.slice(2, 4);
  const digits2 = localPart.slice(4);

  // Validate each part
  if (digits1.length !== 2 || isNaN(digits1)) {
    return false;
  }

  if (cs !== 'cs') {
    return false;
  }

  if (digits2.length !== 3 || isNaN(digits2)) {
    return false;
  }

  return true;
}
