<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskReplacement</title>
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "poppins",sans-serif;
}
body{
    width: 100vw;
    height: 100vh;
    background-color: #306998;
}
.container{
    width: 100%;
    height: 100%;
    display: flex;
    justify-content:space-evenly;
    align-items: center;
}
.taskRe
{
    height: 80%;
    width: 40%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    border: 4px solid rgb(0, 0, 0);
    padding: 50px;
    background-color: #FFD43B;
    border-radius: 4px;
    box-shadow: 0px 0px 60px 5px rgba(0, 0, 0, 0.4);
    
}

.taskRe h4 {

    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 25px;
        margin-bottom:20px ;
    }

    .taskComple{
        height: 80%;
        width: 40%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        border: 4px solid rgb(0, 0, 0);
        padding: 50px;
        background-color: #FFD43B;
        border-radius: 4px;
        box-shadow: 0px 0px 60px 5px rgba(0, 0, 0, 0.4);

    }
    .taskComple h4{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        font-size: 25px;
        margin-bottom:20px ;
    }
    .complreq{
        display: flex;
    justify-content: space-between;
    margin: 10px;
    
    align-items: center;
    width: 100%;
    height: 20%;
    background-color: #306998;
border-radius: 4px;
    box-shadow: 0px 0px 60px 5px rgba(0, 0, 0, 0.4);
    border: 4px solid rgb(0, 0, 0);

    }
    .replacereq{
        display: flex;
        justify-content: space-between;
        margin: 10px;
        align-items: center;
        width: 100%;
        height: 20%;
        background-color: #306998;
    border-radius: 4px;
        box-shadow: 0px 0px 60px 5px rgba(0, 0, 0, 0.4);
        border: 4px solid rgb(0, 0, 0);
    }
    .container button{

      margin: 20px;
    padding: 20px;
    border-radius: 10px;
    }
</style>
<body>
<div class="container">
    <div class="taskRe">
    <h4>Task Replacement Request</h4>
    <div class="replacereq">
        <p id="register">Register no</p>
        <p id="subs">Subject</p>
        <p id="dat">Date</p>
        <button id="del_task">okay</button>
    </div>

    </div> 

    <div class="taskComple">
        <h4>Task Completion</h4>
        <div class="complreq">
            <p id="register1">Register no</p>
        <p id="subs1">Subject</p>
        <p id="dat1">Date</p>
            <button id="del_acc">Accept</button>
        </div>
    </div>
</div>
<script type="module">
     import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        push,
        get,
        onValue,
        remove,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyDkWa8gMvrWxV_9nftyrMrUg_hd3LvxGAE",
    authDomain: "replace----2.firebaseapp.com",
    projectId: "replace----2",
    storageBucket: "replace----2.appspot.com",
    messagingSenderId: "437429447252",
    appId: "1:437429447252:web:2cf6f6be64579f54c31bc1"
      };

      // Initialize Firebase
      

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);

      var mref = ref(database,'task_replacement/')
         onValue(mref,(snapshot)=>{
          const data = snapshot.val()
          for(let key in data)
          {
            if(data[key].staff == localStorage.getItem('name'))
            {
                document.getElementById('register').innerHTML = "<b>RegisterNo: </b>" + data[key].regno
                document.getElementById('subs').innerHTML = "<b> Subject: <b>" + data[key].sub
                document.getElementById('dat').innerHTML = "<b> Date: </b>" + data[key].date
                document.getElementById('del_task').addEventListener('click',function()
            {
                const keyRef = ref(database, 'task_replacement/' + key);

// Remove the key and its value
                remove(keyRef)
                .then(() => {
                    console.log('Removed');
                    window.location.reload()
                })
                .catch((error) => {
                    console.error('Error removing key: ', error);
                });
            })
            }
          }


         })

         var rref = ref(database,'task_completed/')
         onValue(rref,(snapshot)=>{
          const data = snapshot.val()
          for(let key in data)
          {
            if(data[key].staff == localStorage.getItem('name'))
            {
                document.getElementById('register1').innerHTML = "<b>RegisterNo: </b>" + data[key].regno
                document.getElementById('subs1').innerHTML = "<b> Subject: <b>" + data[key].sub
                document.getElementById('dat1').innerHTML = "<b> Date: </b>" + data[key].date
                document.getElementById('del_acc').addEventListener('click',function()
            {
                const keyRef = ref(database, 'task_completed/' + key);

// Remove the key and its value
                remove(keyRef)
                .then(() => {
                    console.log('Removed');
                    window.location.reload()
                })
                .catch((error) => {
                    console.error('Error removing key: ', error);
                });
            })
            }
          }


         })

</script>
</body>
</html>
